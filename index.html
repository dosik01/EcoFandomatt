<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoFandomat</title>
<style>
:root{--bg:#f3f8f4;--card:#fff;--tx:#12301f;--mu:#5d7a69;--pr:#1f9d55;--pr2:#0e6b3a;--bd:#d6e6db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a12;--card:#15281c;--tx:#e6f4ea;--mu:#8fb09c;--pr:#3ccf7a;--pr2:#2aa860;--bd:#244533}}
:root[data-theme="dark"]{--bg:#0d1a12;--card:#15281c;--tx:#e6f4ea;--mu:#8fb09c;--pr:#3ccf7a;--pr2:#2aa860;--bd:#244533}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;min-height:100vh}
h1{margin:0;font-size:26px}h2{margin:0 0 6px}
.mu{color:var(--mu)}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;background:var(--pr);color:#fff;cursor:pointer;margin-top:14px}
.btn.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.logo{font-size:44px}
.qrbox{margin:22px auto;width:230px;height:230px;border:2px dashed var(--pr);border-radius:20px;display:grid;place-items:center;font-size:90px;color:var(--pr);background:#fff;padding:14px;cursor:pointer}
.qrbox svg{width:100%;height:100%;display:block}
.viewf{position:relative;margin:20px auto;width:250px;height:250px;background:#0a0f0c;border-radius:20px;overflow:hidden}
.viewf .fr{position:absolute;inset:36px;border:3px solid #3ccf7a;border-radius:14px}
.viewf .ln{position:absolute;left:36px;right:36px;height:3px;background:#3ccf7a;box-shadow:0 0 12px #3ccf7a;animation:sc 1.6s ease-in-out infinite}
@keyframes sc{0%,100%{top:40px}50%{top:206px}}
.chip{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--card);color:var(--tx);width:100%;font-size:14px;text-align:left}
.chip.on{border-color:var(--pr);background:rgba(31,157,85,.12)}
.ok{font-size:56px;color:var(--pr)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.on-dot{color:var(--pr)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat .card{padding:14px}.stat b{font-size:24px;display:block}
.bottle{font-size:70px;animation:drop 1.2s ease-in-out infinite}
@keyframes drop{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
.sp{flex:1}
.addr{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--mu);margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof{display:flex;gap:12px;align-items:center}.av{width:52px;height:52px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.kaspi{border-color:#f14635}.kl{display:inline-block;background:#f14635;color:#fff;font-weight:700;border-radius:8px;padding:3px 10px;margin-bottom:6px}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:#f14635;border-radius:50%;margin:0 auto 8px;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:0;background:var(--pr);transition:width 1.8s linear}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
function qrSvg(text){
 try{var q=qrcode(0,"M");q.addData("ecofandomat://machine/"+text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}
 catch(e){return "▦"}
}
var MACHINES={
 "ECOF-001":{id:"#001",loc:"Astana",place:"Astana Mall"},
 "ECOF-002":{id:"#002",loc:"Astana",place:"Mega Silk Way"},
 "ECOF-003":{id:"#003",loc:"Astana",place:"University Campus"}
};
var PRICE={bottle:30,can:80},NAME={bottle:"Plastic bottle",can:"Aluminum can"},ICON={bottle:"🍾",can:"🥫"};
var S={screen:"login",qr:"ECOF-001",type:"bottle",n:{bottle:0,can:0},last:"bottle",total:{items:12,money:360},session:0,cnt:0};
S.user={name:"Shokanov Dosymzhan Nurbolatovich",id:"ECO-48213"};
S.hist=[{d:"Sep 30",t:"18:42",p:"Astana Mall",b:3,c:0},{d:"Sep 27",t:"13:15",p:"Mega Silk Way",b:2,c:2},{d:"Sep 24",t:"09:30",p:"Astana Mall",b:4,c:1}];
function money(e){return e.b*PRICE.bottle+e.c*PRICE.can}
function T(){var i=0,mo=0;S.hist.forEach(function(e){i+=e.b+e.c;mo+=money(e)});return{items:i,money:mo}}
function hrow(e){return '<div class="row"><span><b>'+e.d+', '+e.t+'</b> · '+e.p+'<br><span class="mu" style="font-size:13px">🍾 ×'+e.b+' · 🥫 ×'+e.c+'</span></span><b class="on-dot">+'+money(e)+' ₸</b></div>'}
function addr(){return '<div class="addr">🔒 ecofandomat.app/profile/'+S.user.id+'</div>'}
var app=document.getElementById("app"),timer=null;
function m(){return MACHINES[S.qr]}
function earned(){return S.n.bottle*PRICE.bottle+S.n.can*PRICE.can}
function count(){return S.n.bottle+S.n.can}
function go(s){S.screen=s;clearTimeout(timer);render()}
function rates(){return '<div class="card" style="margin-top:14px"><b>Rewards per item</b><div class="row"><span>🍾 Plastic bottle</span><b>'+PRICE.bottle+' ₸</b></div><div class="row"><span>🥫 Aluminum can</span><b>'+PRICE.can+' ₸</b></div></div>'}
function render(){
 var h="";
 switch(S.screen){
 case "login":
  h='<div class="c" style="margin-top:20px"><div class="logo">♻️</div><h1>EcoFandomat</h1><p class="mu">Scan to start recycling</p></div>'+
  '<div class="qrbox" onclick="go(\'scan\')">'+qrSvg(S.qr)+'</div><p class="c mu" style="margin:-10px 0 0;font-size:13px">Machine QR '+S.qr+' · EcoFandomat '+m().id+'</p><p class="c mu">Scan the QR Code on the EcoFandomat machine to continue.</p><div class="sp"></div>'+
  '<p class="mu" style="font-size:13px;margin:0">Demo: choose the machine whose QR code you are "scanning"</p>'+
  Object.keys(MACHINES).map(function(k){var x=MACHINES[k];return '<button class="chip '+(S.qr===k?'on':'')+'" onclick="S.qr=\''+k+'\';render()"><span>▦</span><span><b>'+k+'</b> — EcoFandomat '+x.id+' · '+x.place+'</span></button>'}).join("")+
  '<button class="btn" onclick="go(\'scan\')">Scan QR Code</button>';break;
 case "scan":
  h='<div class="c" style="margin-top:20px"><h2>Scan QR Code</h2><p class="mu">Point the camera at the QR code on the machine</p></div>'+
  '<div class="viewf"><div class="fr"></div><div class="ln"></div></div><p class="c" style="font-weight:600">Scanning...</p><div class="sp"></div>'+
  '<button class="btn sec" onclick="go(\'login\')">Cancel</button>';
  timer=setTimeout(function(){go("verified")},2600);break;
 case "verified":
  var x=m();
  h='<div class="c" style="margin-top:30px"><div class="ok">✓</div><h2>QR Code Verified</h2><p class="mu">Code: '+S.qr+' · opening your profile…</p></div>'+
  '<div class="card" style="margin-top:14px"><div class="row"><span class="mu">Machine</span><b>EcoFandomat '+x.id+'</b></div><div class="row"><span class="mu">Location</span><b>'+x.loc+' · '+x.place+'</b></div><div class="row"><span class="mu">Status</span><b class="on-dot">● Online</b></div></div><div class="sp"></div>'+
  '<button class="btn" onclick="go(\'dash\')">Continue</button>';break;
 case "dash":
  var y=m(),tt=T();
  h=addr()+'<div class="prof"><div class="av">'+S.user.name[0]+'</div><div><h2 style="margin:0">'+S.user.name+'</h2><span class="mu">ID '+S.user.id+' · connected to EcoFandomat '+y.id+' <span class="on-dot">●</span></span></div></div>'+
  '<div class="stat"><div class="card"><b>'+tt.money+' ₸</b><span class="mu">Total earned</span></div><div class="card"><b>'+tt.items+'</b><span class="mu">Items recycled</span></div></div>'+
  '<div class="card" style="margin-top:14px"><b>Recycling history</b>'+S.hist.slice(0,2).map(hrow).join("")+'<button class="btn sec" style="margin-top:10px;padding:10px" onclick="go(\'history\')">View full history</button></div>'+rates()+'<div class="sp"></div>'+
  '<button class="btn" onclick="S.n={bottle:0,can:0};go(\'insert\')">Start Recycling</button>'+
  '<button class="btn sec" onclick="go(\'login\')">Disconnect from machine</button>';break;
 case "history":
  var th=T(),tb=0,tc=0;S.hist.forEach(function(e){tb+=e.b;tc+=e.c});
  h=addr()+'<h2 style="margin-top:14px">Recycling history</h2><div class="stat"><div class="card"><b>'+tb+'</b><span class="mu">🍾 Bottles</span></div><div class="card"><b>'+tc+'</b><span class="mu">🥫 Cans</span></div></div>'+
  '<div class="card" style="margin-top:14px">'+S.hist.map(hrow).join("")+'<div class="row"><b>Total earned</b><b class="on-dot">'+th.money+' ₸</b></div></div><div class="sp"></div><button class="btn" onclick="go(\'dash\')">Back to profile</button>';break;
 case "insert":
  h='<div class="c" style="margin-top:30px"><div class="bottle">'+ICON[S.type]+'</div><h2>Insert Bottle</h2><p class="mu">Choose the item type and place it into the machine slot</p></div>'+
  ['bottle','can'].map(function(t){return '<button class="chip '+(S.type===t?'on':'')+'" onclick="S.type=\''+t+'\';render()"><span style="font-size:22px">'+ICON[t]+'</span><span><b>'+NAME[t]+'</b> — '+PRICE[t]+' ₸</span></button>'}).join("")+'<div class="sp"></div>'+
  '<button class="btn" onclick="go(\'scanning\')">Item inserted (demo)</button><button class="btn sec" onclick="go(\'dash\')">Cancel</button>';break;
 case "scanning":
  h='<div class="c" style="margin-top:50px"><div class="logo">🔍</div><h2>Scanning...</h2><p class="mu">Checking barcode, weight and material</p><div class="bar"><i id="pb"></i></div></div>';
  setTimeout(function(){var b=document.getElementById("pb");if(b)b.style.width="100%"},50);
  timer=setTimeout(function(){S.n[S.type]++;S.last=S.type;go("accepted")},2000);break;
 case "accepted":
  var t=S.last;
  h='<div class="c" style="margin-top:40px"><div class="ok">✓</div><h2>'+(t==="can"?"Can":"Bottle")+' Accepted</h2><p class="mu">+'+PRICE[t]+' ₸ for '+NAME[t].toLowerCase()+'</p></div>'+
  '<div class="card"><div class="row"><span>🍾 Bottles × '+S.n.bottle+'</span><b>'+S.n.bottle*PRICE.bottle+' ₸</b></div><div class="row"><span>🥫 Cans × '+S.n.can+'</span><b>'+S.n.can*PRICE.can+' ₸</b></div><div class="row"><b>Session total</b><b class="on-dot">'+earned()+' ₸</b></div></div><div class="sp"></div>'+
  '<button class="btn" onclick="go(\'insert\')">Insert another item</button><button class="btn sec" onclick="go(\'reward\')">Finish</button>';break;
 case "reward":
  var pay=earned(),nb=S.n.bottle,nc=S.n.can;
  S.hist.unshift({d:"Today",t:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false}),p:m().place,b:nb,c:nc});S.session=pay;S.n={bottle:0,can:0};
  h='<div class="c" style="margin-top:30px"><div class="logo">🎉</div><h2>Reward</h2><p class="mu">Thank you for recycling!</p></div>'+
  '<div class="card c"><b style="font-size:40px;color:var(--pr)">+'+pay+' ₸</b><br><span class="mu">'+nb+' bottle(s) × '+PRICE.bottle+' ₸ + '+nc+' can(s) × '+PRICE.can+' ₸</span></div>'+
  '<div class="card kaspi" style="margin-top:12px"><div id="kp" class="c"><div class="spin"></div><b>Sending to Kaspi...</b><p class="mu" style="margin:4px 0 0">Transferring your reward</p></div></div><div class="sp"></div>'+
  '<button class="btn" onclick="go(\'dash\')">Back to Dashboard</button>';
  timer=setTimeout(function(){var e=document.getElementById("kp");if(e)e.innerHTML='<div class="kl">Kaspi.kz</div><div class="ok" style="font-size:40px">✓</div><b>Money sent to Kaspi</b><div style="font-size:34px;font-weight:700;margin:6px 0">+'+pay+' ₸</div><div class="row"><span class="mu">Account</span><b>Kaspi Gold ••12</b></div><div class="row"><span class="mu">Status</span><b class="on-dot">Completed</b></div><div class="row"><span class="mu">Transaction</span><b>#EF'+m().id.slice(1)+'-'+Date.now().toString().slice(-6)+'</b></div>'},1800);break;
 }
 app.innerHTML=h;
}
render();
</script>
</body>
</html>
